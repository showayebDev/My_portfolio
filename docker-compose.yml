services:
  # ============================================================
  # 1. Payload CMS Backend Application
  # ============================================================
  app:
    image: showayebdev/my_portfolio:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: cms
    container_name: nextjs-payload-app
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3000\").then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  # ============================================================
  # 2. Astro Frontend Application
  # ============================================================
  astro:
    image: showayebdev/my_portfolio_astro:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: astro
    container_name: astro-frontend-app
    restart: always
    ports:
      - '4321:4321'
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      - PAYLOAD_URL=http://app:3000
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-http://localhost:4321}
    depends_on:
      app:
        condition: service_healthy
