services:
  # ============================================================
  # 1. PostgreSQL Database Service (pg) - INTERNAL ONLY
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: local-postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio
    # Isolated: Not mapped to host ports (not accessible externally)
    expose:
      - '5432'
    # To temporarily inspect with DBeaver/TablePlus from your host, uncomment:
    # ports:
    #   - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d portfolio']
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # 2. MinIO (S3-Compatible Object Storage) - INTERNAL ONLY
  # ============================================================
  s3:
    image: cgr.dev/chainguard/minio:latest
    container_name: local-minio-s3
    restart: always
    user: '0:0'
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    # Isolated: Not mapped to host ports (not accessible externally)
    expose:
      - '9000' # S3 API endpoint (accessible only by 'app' & 'create-bucket')
      - '9001' # Web console (internal)
    ports:
      - '9000:9000'
    volumes:
      - minio_data:/data

  # ============================================================
  # 3. MinIO Bucket Provisioner (Creates S3 bucket)
  # ============================================================
  create-bucket:
    build:
      context: .
      dockerfile_inline: |
        FROM cgr.dev/chainguard/minio-client:latest AS mc
        FROM alpine:latest
        COPY --from=mc /usr/bin/mc /usr/bin/mc
    environment:
      - S3_ENDPOINT=${S3_ENDPOINT:-http://s3:9000}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-my-portfolio}
    depends_on:
      - s3
    entrypoint:
      - /bin/sh
      - -c
      - |
        while ! /usr/bin/mc alias set localminio "$$S3_ENDPOINT" "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" 2>/dev/null; do
          sleep 1
        done
        /usr/bin/mc mb "localminio/$${S3_BUCKET}" || true
        /usr/bin/mc anonymous set download "localminio/$${S3_BUCKET}" || true
        exit 0

  # ============================================================
  # 4. Next.js + Payload CMS Application - PUBLIC GATEWAY
  # ============================================================
  app:
    image: showayebdev/my_portfolio:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs-payload-full-app
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - create-bucket
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/portfolio?sslmode=disable}
      - S3_BUCKET=${S3_BUCKET:-my-portfolio}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://s3:9000}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}

volumes:
  postgres_data:
    name: my_portfolio_postgres_data
  minio_data:
    name: my_portfolio_minio_data
