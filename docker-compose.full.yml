services:
  # ============================================================
  # 1. PostgreSQL Database Service (pg) - INTERNAL ONLY
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: local-postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d portfolio']
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # 2. MinIO (S3-Compatible Object Storage) - INTERNAL ONLY
  # ============================================================
  s3:
    image: cgr.dev/chainguard/minio:latest
    container_name: local-minio-s3
    restart: always
    user: '0:0'
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    expose:
      - '9000'
      - '9001'
    ports:
      - '9000:9000'
    volumes:
      - minio_data:/data

  # ============================================================
  # 3. Next.js + Payload CMS Application - PUBLIC GATEWAY
  # ============================================================
  app:
    image: showayebdev/my_portfolio:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: cms
    container_name: nextjs-payload-full-app
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    env_file:
      - .env.docker.full
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3000\").then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  # ============================================================
  # 4. Astro Frontend Application
  # ============================================================
  astro:
    image: showayebdev/my_portfolio_astro:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: astro
    container_name: astro-frontend-full-app
    restart: always
    ports:
      - '4321:4321'
    env_file:
      - .env.docker.full
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      - PAYLOAD_URL=http://app:3000
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
    name: my_portfolio_postgres_data
  minio_data:
    name: my_portfolio_minio_data
